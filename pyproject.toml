[project]
name = "jevify-cli"  # "jevify" is already taken on PyPI by an unrelated project
version = "0.1.0"
description = "Rewrite LLM-as-classifier calls to use TypeSafe Jev first, keeping the LLM as a verified fallback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "refactoring", "cost-reduction", "classification", "typesafe", "jev", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jashwanthsai678/jevify-analyze"
Issues = "https://github.com/jashwanthsai678/jevify-analyze/issues"
Changelog = "https://github.com/jashwanthsai678/jevify-analyze/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jevify = "jevify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevify"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
