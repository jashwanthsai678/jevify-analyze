[project]
name = "jevvify"  # not "jevify": that name belongs to an unrelated PyPI project
version = "0.2.0"
description = "Rewrite LLM-as-classifier calls to use TypeSafe Jev first, keeping the LLM as a verified fallback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "refactoring", "cost-reduction", "classification", "typesafe", "jev", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jashwanthsai678/jevify-analyze"
Issues = "https://github.com/jashwanthsai678/jevify-analyze/issues"
Changelog = "https://github.com/jashwanthsai678/jevify-analyze/blob/main/CHANGELOG.md"

[project.optional-dependencies]
multilang = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
jevvify = "jevvify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevvify"]

[tool.hatch.build.targets.wheel.force-include]
"benchmarks/prompts.jsonl" = "jevvify/data/prompts.jsonl"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "benchmarks", "examples", "docs", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
