name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Tests
        run: uv run --python 3.13 --extra dev --extra multilang python -m pytest -q
      - name: Build sdist and wheel
        run: uv build
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/*-"${tag}"-*.whl >/dev/null 2>&1 || { echo "No wheel for version ${tag} in dist/"; ls dist; exit 1; }
      - name: Install the built wheel into a clean environment
        run: |
          uv venv --python 3.13 /tmp/sbom-env
          uv pip install --python /tmp/sbom-env dist/*.whl
          /tmp/sbom-env/bin/jevvify --version
      - name: Generate CycloneDX SBOM of the wheel's environment
        uses: anchore/sbom-action@v0
        with:
          path: /tmp/sbom-env
          format: cyclonedx-json
          output-file: jevvify-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: jevvify-${{ github.ref_name }}.cdx.json
          if-no-files-found: error

  attest:
    name: Build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jevvify/
    permissions:
      id-token: write  # PyPI trusted publishing: configure the publisher on pypi.org first (see .github/RELEASING.md)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom/*.cdx.json
