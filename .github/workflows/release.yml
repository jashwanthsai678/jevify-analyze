name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: configure the publisher on pypi.org first
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.13 --with pytest python -m pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
